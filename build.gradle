plugins {
    id 'java'
    id 'pmd'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.142'
    id 'com.gto.gtopublishgradleplugin' version '1.0.27'
}

version = gto_version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
archivesBaseName = "${mod_name}"

repositories {
    mavenCentral()

    maven {
        name = 'GTOdyssey'
        url = 'https://gtodyssey.com/maven/releases'
        content {
            includeGroup 'com.gto'
            includeGroup 'appeng'
        }
    }

    maven {
        name = 'Sponge / Mixin'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

tasks.withType(GenerateModuleMetadata).configureEach {
    it.enabled = false
}

pmd {
    toolVersion = '7.7.0'
    incrementalAnalysis = false
    ruleSetFiles = rootProject.files("spotless/pmd-ruleset.xml")
    consoleOutput = true
}

jar {
    from "LICENSE.txt"

    exclude "**/*.bat"
    exclude "**/*.psd"
    exclude "**/*.ase"
    exclude "**/*.exe"
    exclude "**/unused"

    exclude ".cache"
}

spotless {
    enforceCheck = false // workaround around jenkins having wrong line endings in some files
    // we explicitly check in github actions builds
    java {
        indentWithTabs()
        eclipse().configFile rootProject.file('spotless/eclipseformat.xml')
        removeUnusedImports()
        importOrderFile rootProject.file('spotless/eclipse.importorder')
    }
}

mixin {
    add sourceSets.main, "botania.refmap.json"

    config "botania_xplat.mixins.json"
    config "botania_forge.mixins.json"
}

repositories {
    maven {
        name = "Jared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "C4"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/" // for emi and ears
        content {
            includeGroup("com.unascribed")
            includeGroup("dev.emi")
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven" // for Sodium ports
        content {
            includeGroup "maven.modrinth"
        }
    }
}

legacyForge {
    enable {
        forgeVersion = "1.20.1-47.4.20"
        // TODO: Legacy MDG bug? Can't compile anonymous classes with more than one constructor parameter in CI mode.
        disableRecompilation = false
    }
    accessTransformers = [file('src/main/resources/META-INF/accesstransformer.cfg')]

    parchment {
        minecraftVersion = '1.20.1'
        mappingsVersion = '2023.09.03'
    }

    runs {
        client {
            client()
            systemProperty('forge.logging.console.level', 'debug')
        }

        server {
            server()
            systemProperty('forge.logging.console.level', 'debug')
        }

        data {
            data()
            programArguments.addAll "-mixin.config=botania_xplat.mixins.json", "-mixin.config=botania_forge.mixins.json"
            programArguments.addAll '--mod', 'botania', '--all'
            programArguments.addAll '--output', file('src/generated/resources/').getAbsolutePath()
            programArguments.addAll '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            gameDirectory = file('run/')
            systemProperty('fml.earlyprogresswindow', 'false')
        }
    }

    mods {
        botania {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    modImplementation("vazkii.patchouli:Patchouli:${minecraft_version}-84-FORGE")
    modImplementation("com.gto:datasynclib-forge-1.20.1:${datasynclib_version}")
    modImplementation("com.gto:gtoutils-forge-1.20.1:${gtoutils_version}")
    modImplementation("com.gto:gtorenders-forge-1.20.1:${gtorenders_version}")
    modCompileOnly("mezz.jei:jei-1.20.1-common-api:15.2.0.27")
    modRuntimeOnly("mezz.jei:jei-1.20.1-forge:15.2.0.27")

    modCompileOnlyApi("dev.emi:emi-forge:1.0.4+${minecraft_version}")
    //modRuntimeOnly("dev.emi:emi-forge:1.1.24+${minecraft_version}")

    modCompileOnly("top.theillusivec4.curios:curios-forge:5.4.2+1.20.1:api")
    modCompileOnly("appeng:appliedenergistics2-forge-1.20.1:${ae2_version}") { transitive = false }
    modRuntimeOnly("top.theillusivec4.curios:curios-forge:5.4.2+1.20.1")

    // modCompileOnly('com.blamejared.crafttweaker:CraftTweaker-forge-1.18.2:9.1.123')

    modCompileOnly('com.unascribed:ears-api:1.4.5')

    modCompileOnly('maven.modrinth:rubidium:0.7.0') { transitive = false }

    compileOnly "org.jetbrains:annotations:24.0.1"
}

compileJava {
    options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-serial,-this-escape,-lossy-conversions,-removal" << "-Werror"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'assets/botania/patchouli_books/lexicon/en_us/README'
}

processResources {
    inputs.property "version", project.version

    filesMatching("mods.toml") {
        expand "version": project.version
    }

    from 'contributors.properties'
    // Exclude datagenerator .cache directory
    exclude '.cache'
}
jar {
    manifest {
        attributes([
                "Specification-Title": "${mod_name}",
                "Specification-Vendor": "vazkii",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": "${mod_name}",
                "Implementation-Version": "${archiveVersion.get()}",
                "Implementation-Vendor" :"vazkii",
                "MixinConfigs": "botania_xplat.mixins.json,botania_forge.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

task apiJar(type: Jar, dependsOn: classes) {
    // Sources included because of MinecraftForge/ForgeGradle#369
    from(sourceSets.main.allJava)
    from(sourceSets.main.output)

    include 'vazkii/botania/api/**'

    archiveClassifier = 'api'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact reobfJar
            artifact sourcesJar
            artifact apiJar
            pom.withXml {
                def node = asNode()
                if(node.dependencies.size() > 0)
                    node.remove(node.dependencies) // Remove deps, as they are all mappings-dependent and/or forge
            }
        }
    }
    repositories {
        maven {
            name = 'gtodysseyRepository'
            url = 'https://gtodyssey.com/maven/releases'
            credentials {
                username = findProperty('gtodysseyRepositoryUsername') ?: ''
                password = findProperty('gtodysseyRepositoryPassword') ?: ''
            }
        }
    }
}

gtoPublish {
    publishMaven      = true
    publishGithub     = false
    publishCurseforge = true
    mavenRepoName     = 'gtodysseyRepository'
    mavenRepoUrl      = 'releases'
    minecraftVersion  = '1.20.1'
    modLoader         = 'Forge'
    curseforgeProjectId   = '1754410'
    curseforgeJavaVersion = 'Java 21'
    curseforgeEnvironment = 'both'
    curseforgeRelations   = [patchouli: 'required', curios: 'required', 'data-sync-lib': 'required']
}
